<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SwatGo</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"SwatGo","short_name":"SwatGo","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#000000"}'>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; }

  /* ---------- SPLASH (FULLSCREEN) ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
    overflow: hidden;
  }
  #splash img {
    width: 100%;
    height: 100%;
    object-fit: cover;       /* fills entire screen */
    object-position: center;
    display: block;
  }
  #splash.hide { opacity: 0; pointer-events: none; }

  /* ---------- APP ---------- */
  #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  #app.show { display: flex; }

  #frame-wrap { flex: 1; position: relative; background: #fff; }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
    display: none;
  }
  iframe.active { display: block; }

  /* Loader */
  #loader {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: #fff; z-index: 5;
  }
  #loader.show { display: flex; }
  .spinner {
    width: 42px; height: 42px;
    border: 4px solid #e5e5e5;
    border-top-color: #333;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- BOTTOM TABS ---------- */
  #tabs {
    display: flex;
    background: #fff;
    border-top: 1px solid #e5e5e5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8px 4px 6px;
    font-size: 11px; font-weight: 500;
    color: #888;
    cursor: pointer;
    transition: color 0.15s;
    user-select: none;
  }
  .tab.active { color: #111; }
  .tab svg { width: 24px; height: 24px; margin-bottom: 2px; stroke: #888; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active svg { stroke: #111; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <img src="https://i.postimg.cc/L6HxthcF/effb4800-8d8c-4d50-9461-f5c378ca461b.png" alt="Loading">
</div>

<!-- APP -->
<div id="app">
  <div id="frame-wrap">
    <div id="loader"><div class="spinner"></div></div>
    <iframe data-tab="0" src="https://swatgo.github.io/Admin/" allow="geolocation; camera; microphone; clipboard-write"></iframe>
    <iframe data-tab="1" data-src="https://swatgo.github.io/Merchant/" allow="geolocation; camera; microphone; clipboard-write"></iframe>
    <iframe data-tab="2" data-src="https://swatgo.github.io/Customer/" allow="geolocation; camera; microphone; clipboard-write"></iframe>
    <iframe data-tab="3" data-src="https://swatgo.github.io/Rider/" allow="geolocation; camera; microphone; clipboard-write"></iframe>
  </div>

  <nav id="tabs">
    <div class="tab active" data-tab="0">
      <svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
      Admin
    </div>
    <div class="tab" data-tab="1">
      <svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M3 9h18"/><path d="M9 13h6"/></svg>
      Merchant
    </div>
    <div class="tab" data-tab="2">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      Customer
    </div>
    <div class="tab" data-tab="3">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M4 18V6h11l3 5h2v7"/><path d="M4 10h9"/></svg>
      Rider
    </div>
  </nav>
</div>

<script>
  // ---------- SPLASH ----------
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').classList.add('show');
    setTimeout(() => document.getElementById('splash').remove(), 500);
    showTab(0);
  }, 8000);

  // ---------- TAB LOGIC ----------
  const frames = document.querySelectorAll('iframe');
  const tabs = document.querySelectorAll('.tab');
  const loader = document.getElementById('loader');
  let current = -1;

  function showTab(i) {
    if (i === current) return;
    current = i;

    frames.forEach(f => {
      const idx = +f.dataset.tab;
      if (idx === i) {
        if (!f.src && f.dataset.src) {
          loader.classList.add('show');
          f.src = f.dataset.src;
          f.addEventListener('load', () => loader.classList.remove('show'), { once: true });
          setTimeout(() => loader.classList.remove('show'), 8000);
        }
        f.classList.add('active');
      } else {
        f.classList.remove('active');
      }
    });

    tabs.forEach(t => t.classList.toggle('active', +t.dataset.tab === i));
  }

  tabs.forEach(t => {
    t.addEventListener('click', () => showTab(+t.dataset.tab));
  });

  // ---------- HARDWARE BACK (Android) ----------
  window.addEventListener('popstate', () => {
    if (current !== 0) {
      showTab(0);
      history.pushState(null, '', location.href);
    }
  });
  history.pushState(null, '', location.href);
</script>
</body>
</html>
